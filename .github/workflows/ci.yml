name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: tests, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests
        run: pytest --cov --cov-report=term-missing

  figures:
    name: regenerate report and figures
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build
        run: >-
          python -m execution_sim report
          --out ci-artifacts/results
          --figures ci-artifacts/figures
          --paths 20000
          --seed 7
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: ci-artifacts/
          if-no-files-found: error
      - name: Check the raw table
        run: python -m execution_sim compare
